<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>E3 Thanksgiving Trivia</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"><style>
body.rt{margin:0;background:#f2eff6;color:#1f1830;font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',sans-serif;line-height:1.4}
body.rt.sz-large{font-size:20px}body.rt.sz-xl{font-size:24px}body.rt.sz-huge{font-size:28px}
.rt *{box-sizing:border-box}
.rt-wrap{max-width:900px;margin:0 auto;padding:14px}
.rt-card{background:#fff;border:2px solid #d8cfe5;border-radius:14px;padding:16px 18px}
.rt h2{color:#5b3491;margin:0 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.35em}
.rt h2:focus{outline:none}
.rt-note{color:#5e5374;margin:4px 0 10px}
.rt-btn{min-height:52px;font:inherit;font-weight:700;border-radius:12px;padding:10px 20px;border:2px solid #5b3491;background:#fff;color:#5b3491;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.rt-btn.main{background:#c2560f;border-color:#a9500f;color:#fff}
.rt-btn:disabled{opacity:.45;cursor:default}
.rt-btn:focus-visible,.rt-opt:focus-visible,.rt-say:focus-visible,.rt input:focus{outline:4px solid #e8731c;outline-offset:2px}
.rt-say{min-width:52px;min-height:52px;border-radius:50%;border:2px solid #5b3491;background:#fff;font-size:1.1em;cursor:pointer;flex:none}
.rt input[type=text]{font:inherit;width:100%;max-width:420px;padding:12px;border:2px solid #5b3491;border-radius:12px;display:block;margin:6px 0 12px}
.rt-lab{font-weight:700;display:block;margin-top:12px}
.rt-prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-weight:700}
.rt-dots{display:flex;gap:6px;flex-wrap:wrap}
.rt-dot{width:18px;height:18px;border-radius:50%;border:2px solid #5b3491;display:inline-block}
.rt-dot.done{background:#5b3491}.rt-dot.now{background:#e8731c;border-color:#a9500f}
.rt-qpic{display:block;max-width:100%;max-height:36vh;margin:6px auto 10px;border-radius:12px;border:2px solid #d8cfe5;background:#fff;object-fit:contain}
.rt-q{display:flex;gap:12px;align-items:flex-start}
.rt-qtext{font-size:1.3em;font-weight:700;margin:4px 0 12px;flex:1}
.rt-ogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.rt-ogrid{grid-template-columns:1fr}}
.rt-opt{display:flex;align-items:center;gap:14px;text-align:left;min-height:68px;padding:12px 14px;border:3px solid #d8cfe5;border-radius:14px;background:#fff;font:inherit;color:#1f1830;cursor:pointer;width:100%}
.rt-opt .let{width:46px;height:46px;border-radius:50%;border:3px solid #5b3491;display:flex;align-items:center;justify-content:center;font-weight:700;color:#5b3491;flex:none;font-family:Verdana,sans-serif}
.rt-opt .otx{display:flex;flex-direction:column;gap:4px}
.rt-opt img{max-height:110px;max-width:160px;object-fit:contain}
.rt-opt[aria-pressed=true]{border-color:#5b3491;background:#efe7fa;box-shadow:inset 0 0 0 3px #5b3491}
.rt-opt[aria-pressed=true] .let{background:#5b3491;color:#fff}
.rt-opt.wrong{border-color:#b3261e;background:#fdecea;cursor:default}
.rt-opt.wrong .main-t{text-decoration:line-through}
.rt-opt.gone{opacity:.4;cursor:default}
.rt-opt.right{border-color:#1f7a45;background:#e6f4ec;opacity:1}
.rt-opt.right .let{background:#1f7a45;border-color:#1f7a45;color:#fff}
.rt-opt small{font-weight:700;font-size:.8em}
.rt-opt.wrong small{color:#b3261e}.rt-opt.right small{color:#1f7a45}
.rt-opt.glow{animation:rtglow 1.1s ease-in-out infinite}
@keyframes rtglow{0%,100%{box-shadow:0 0 0 0 rgba(232,115,28,.0)}50%{box-shadow:0 0 0 8px rgba(232,115,28,.65)}}
.rt-fb{margin:14px 0 4px;padding:12px 14px;border-radius:12px;border:3px solid;display:flex;gap:12px;align-items:center}
.rt-fb p{margin:0;flex:1;font-weight:700}
.rt-fb.good{border-color:#1f7a45;background:#e6f4ec}.rt-fb.bad{border-color:#b3261e;background:#fdecea}.rt-fb.info{border-color:#e8731c;background:#fff4e8}
.rt-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.rt-score{font-size:1.5em;font-weight:700;margin:6px 0}
.rt-pre{white-space:pre-wrap;word-break:break-all;background:#f6f2fb;padding:10px;border-radius:10px;font-size:.75em}
.rt-sr,.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rt ol li,.rt ul li{margin:4px 0}
</style></head><body><div id="app"></div><script>(function trvRuntime(CFG){
  'use strict';
  var EMOJI_RE=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
  var F=CFG.look!=='adult', LET='ABCD';
  document.body.classList.add('rt','sz-'+(CFG.size||'large'));
  document.title=CFG.title||'Trivia';
  var root=document.getElementById('app')||document.body.appendChild(document.createElement('div'));
  var live=document.createElement('div');live.className='rt-sr';live.setAttribute('aria-live','polite');document.body.appendChild(live);

  function h(tag,props){
    var el=document.createElement(tag);props=props||{};
    Object.keys(props).forEach(function(k){var v=props[k];if(v==null||v===false)return;
      if(k==='class')el.className=v;else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
      else if(k==='value')el.value=v;else el.setAttribute(k,v===true?'':v);});
    (function add(a){a.forEach(function(c){if(c==null||c===false)return;if(Array.isArray(c))add(c);else el.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));});})([].slice.call(arguments,2));
    return el;
  }
  function words(t){
    return String(t).replace(EMOJI_RE,'')
      .replace(/\$(\d+)\.(\d\d)/g,function(m,d,c){d=+d;c=+c;var s='';if(d)s+=d+(d===1?' dollar':' dollars');if(d&&c)s+=' and ';if(c)s+=c+(c===1?' cent':' cents');return s||'0 dollars';})
      .replace(/\$(\d+)/g,function(m,d){return d+(d==='1'?' dollar':' dollars');})
      .replace(/°F/g,' degrees').replace(/°/g,' degrees').replace(/×/g,' times ').replace(/−/g,' minus ')
      .replace(/[✓✗•…→▶↺]/g,' ').replace(/\s+/g,' ').trim();
  }
  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(words(t));u.rate=+CFG.rate||0.85;u.lang='en-US';speechSynthesis.speak(u);}catch(e){}}
  function tell(t){live.textContent='';setTimeout(function(){live.textContent=words(t);},40);if(CFG.speak==='auto')speak(t);}
  function sayBtn(get,label,k){if(CFG.speak==='off')return null;return h('button',{class:'rt-say',type:'button','aria-label':label||'Read aloud','data-k':k,onclick:function(){speak(typeof get==='function'?get():get);}},'🔊');}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  window.addEventListener('pagehide',function(){try{speechSynthesis.cancel();}catch(e){}});

  var S=null;
  function reset(){
    var nm=S?S.name:'';
    S={screen:'start',name:nm,li:0,qi:0,t0:0,cur:null,fb:null,focusH:true,focusK:null,sent:false,R:null,msg:''};
    S.L=CFG.rounds.map(function(r){return {name:r.name,qs:CFG.shuffleQ?shuffle(r.qs.slice()):r.qs.slice()};});
    S.lv=S.L.map(function(){return {m:0,h:0,sh:0,items:[]};});
  }
  function Q(){return S.L[S.li].qs[S.qi];}
  function filled(q){return [0,1,2,3].filter(function(i){return (q.o[i]||'').trim()||(q.oi&&q.oi[i]);});}
  function newItem(){var o=filled(Q());if(CFG.shuffle)shuffle(o);S.cur={order:o,picked:null,wrong:[],gone:[],glow:false,tries:0,hints:0,done:false,shown:false};S.fb=null;}
  function L(oi){return LET[S.cur.order.indexOf(oi)];}
  function otext(q,oi){return (q.o[oi]||'').trim()||'the picture';}
  function readQ(){var q=Q(),c=S.cur;return q.q+' '+c.order.filter(function(oi){return c.gone.indexOf(oi)<0&&c.wrong.indexOf(oi)<0;}).map(function(oi){return L(oi)+': '+otext(q,oi)+'.';}).join(' ');}
  function roundTitle(i){return (S.L.length>1?'Round '+(i+1)+' of '+S.L.length+': ':'')+S.L[i].name;}

  function render(){
    var ae=document.activeElement,key=S.focusK||(ae&&ae.getAttribute&&ae.getAttribute('data-k'));S.focusK=null;
    root.textContent='';root.appendChild(h('div',{class:'rt-wrap'},view()));
    if(S.focusH){S.focusH=false;var hh=root.querySelector('h2');if(hh){hh.tabIndex=-1;hh.focus();}return;}
    if(key){var el=root.querySelector('[data-k="'+key+'"]');if(el&&!el.disabled)el.focus();}
  }
  function view(){return S.screen==='start'?vStart():S.screen==='level'?vLevel():S.screen==='between'?vBetween():vFinish();}
  function fbBox(){return h('div',{class:'rt-fb '+S.fb.k},h('p',null,S.fb.t),sayBtn(S.fb.t,'Read the message','fbsay'));}

  function vStart(){
    return h('div',{class:'rt-card'},
      h('h2',null,(F?'🧠 ':'')+CFG.title,sayBtn(function(){return CFG.title+'. '+CFG.directions;},'Read the directions','s-say')),
      h('p',null,CFG.directions),
      S.L.length>1?[h('p',null,'This activity has '+S.L.length+' rounds:'),h('ol',null,S.L.map(function(r){return h('li',null,r.name+' ('+r.qs.length+' questions)');}))]:h('p',null,S.L[0].qs.length+' questions.'),
      h('label',{class:'rt-lab',for:'rt-name'},'Type your name'),
      h('input',{type:'text',id:'rt-name','data-k':'name',value:S.name,autocomplete:'off',oninput:function(e){S.name=e.target.value;},onkeydown:function(e){if(e.key==='Enter')start();}}),
      S.fb?fbBox():null,
      h('div',{class:'rt-tools'},h('button',{class:'rt-btn main',type:'button','data-k':'start',onclick:start},'Start ▶')));
  }
  function start(){
    if(!S.name.trim()){S.fb={k:'bad',t:'✗ Type your name first. Then tap Start.'};S.focusK='name';render();tell(S.fb.t);return;}
    S.t0=Date.now();S.li=0;S.qi=0;S.screen='level';newItem();S.focusH=true;render();
    tell(roundTitle(0)+'. Question 1. '+readQ());
  }
  function vLevel(){
    var r=S.L[S.li],q=Q(),c=S.cur,n=r.qs.length,last=S.li===S.L.length-1&&S.qi===n-1;
    var opts=c.order.map(function(oi,pos){
      var wr=c.wrong.indexOf(oi)>=0,gone=c.gone.indexOf(oi)>=0,right=c.done&&oi===q.c;
      var cls='rt-opt'+(wr?' wrong':'')+(gone?' gone':'')+(right?' right':'')+(c.glow&&!c.done&&oi===q.c?' glow':'');
      var st=right?'✓ Right answer':wr?'✗ Not this one':gone?'Not this one (hint)':'';
      var txt=(q.o[oi]||'').trim();
      return h('button',{class:cls,type:'button','data-k':'o'+pos,'aria-pressed':String(c.picked===oi),disabled:(wr||gone||c.done)?true:null,
        onclick:function(){c.picked=oi;S.fb=null;render();if(CFG.speak==='auto')speak(LET[pos]+': '+otext(q,oi));}},
        h('span',{class:'let','aria-hidden':'true'},LET[pos]),
        h('span',{class:'otx'},h('span',{class:'sr'},LET[pos]+': '),q.oi&&q.oi[oi]?h('img',{src:q.oi[oi],alt:txt?'':'Picture '+LET[pos]}):null,txt?h('span',{class:'main-t'},txt):null,st?h('small',null,st):null));
    });
    return h('div',{class:'rt-card'},
      h('h2',null,roundTitle(S.li),sayBtn(function(){return roundTitle(S.li)+'. '+CFG.directions;},'Read the directions','l-say')),
      h('p',{class:'rt-note'},'Tap the best answer. Then tap Check.'),
      h('div',{class:'rt-prog'},h('span',{class:'rt-dots','aria-hidden':'true'},r.qs.map(function(_,i){return h('span',{class:'rt-dot'+(i<S.qi?' done':i===S.qi?' now':'')});})),h('span',null,'Question '+(S.qi+1)+' of '+n)),
      q.img?h('img',{class:'rt-qpic',src:q.img,alt:'Picture for this question'}):null,
      h('div',{class:'rt-q'},h('p',{class:'rt-qtext'},q.q),sayBtn(readQ,'Read the question and answers','q-say')),
      h('div',{class:'rt-ogrid',role:'group','aria-label':'Answers'},opts),
      S.fb?fbBox():null,
      h('div',{class:'rt-tools'},c.done
        ?h('button',{class:'rt-btn main',type:'button','data-k':'next',onclick:next},last?'Finish ▶':'Next ▶')
        :[h('button',{class:'rt-btn main',type:'button','data-k':'check',onclick:check},'✓ Check'),
          CFG.hints?h('button',{class:'rt-btn',type:'button','data-k':'hint',onclick:hint},'💡 Hint'):null,
          CFG.showMe?h('button',{class:'rt-btn',type:'button','data-k':'show',onclick:showMe},'👀 Show me'):null]));
  }
  function item(q,c){var t=q.q.length>50?q.q.slice(0,48)+'…':q.q;return [t,c.shown?'shown':c.tries===0?'first try':'after '+(c.tries+1)+' tries',c.hints];}
  function leftWrong(){var q=Q(),c=S.cur;return c.order.filter(function(oi){return oi!==q.c&&c.wrong.indexOf(oi)<0&&c.gone.indexOf(oi)<0;});}
  function check(){
    var q=Q(),c=S.cur,lv=S.lv[S.li];
    if(c.picked==null){S.fb={k:'info',t:'💡 Tap an answer first. Then tap Check.'};}
    else if(c.picked===q.c){c.done=true;lv.items.push(item(q,c));
      S.fb={k:'good',t:(F?'⭐ Great job! ':'Correct. ')+L(q.c)+': '+otext(q,q.c)+' is right.'+(q.f?' '+q.f:'')};S.focusK='next';}
    else{var p=c.picked;c.tries++;lv.m++;c.wrong.push(p);c.picked=null;
      var left=leftWrong().length;
      S.fb={k:'bad',t:'✗ '+L(p)+': '+otext(q,p)+' is not the answer. '+(left===0?'Only one answer is left. Tap it, then tap Check.':'Read the question again and pick a different answer.')+(CFG.hints&&left>0?' You can tap Hint for help.':'')};}
    render();tell(S.fb.t);
  }
  function hint(){
    var q=Q(),c=S.cur;c.hints++;S.lv[S.li].h++;
    var w=leftWrong();
    if(c.hints===1){S.fb={k:'info',t:'💡 Hint: '+(q.hint||'Read the question again slowly. Look at the picture. Which answers do not make sense?')};}
    else if(w.length>1){shuffle(w);while(w.length>1)c.gone.push(w.pop());if(c.gone.indexOf(c.picked)>=0)c.picked=null;
      S.fb={k:'info',t:'💡 Some wrong answers are gone. The answer is one of the two that are left.'};}
    else{c.glow=true;S.fb={k:'info',t:'💡 Look at the answer that is glowing. Tap it, then tap Check.'};}
    render();tell(S.fb.t);
  }
  function showMe(){
    var q=Q(),c=S.cur,lv=S.lv[S.li];c.done=true;c.shown=true;lv.sh++;lv.m++;lv.items.push(item(q,c));
    S.fb={k:'info',t:'👀 The answer is '+L(q.c)+': '+otext(q,q.c)+'.'+(q.f?' '+q.f:'')};S.focusK='next';render();tell(S.fb.t);
  }
  function next(){
    var r=S.L[S.li];S.fb=null;
    if(S.qi<r.qs.length-1){S.qi++;newItem();S.focusH=true;render();if(CFG.speak==='auto')speak('Question '+(S.qi+1)+'. '+readQ());}
    else if(S.li<S.L.length-1){S.screen='between';S.focusH=true;render();tell('Round '+(S.li+1)+' done! Next: '+S.L[S.li+1].name+'.');}
    else{finish();S.screen='finish';S.focusH=true;render();tell(S.R.headline);}
  }
  function vBetween(){
    var n=S.li+1;
    return h('div',{class:'rt-card'},
      h('h2',null,(F?'🎉 ':'')+'Round '+n+' done!',sayBtn(function(){return 'Round '+n+' done! Next: Round '+(n+1)+': '+S.L[n].name;},'Read this','b-say')),
      h('p',null,'Next: Round '+(n+1)+': '+S.L[n].name+' ('+S.L[n].qs.length+' questions).'),
      h('div',{class:'rt-tools'},h('button',{class:'rt-btn main',type:'button','data-k':'go',onclick:function(){S.li++;S.qi=0;S.screen='level';newItem();S.focusH=true;render();tell(roundTitle(S.li)+'. Question 1. '+readQ());}},'Go ▶')));
  }
  function hash(s){var x=0x811c9dc5;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0;}return ('0000000'+x.toString(16).toUpperCase()).slice(-8);}
  function fmtTime(s){var m=Math.floor(s/60);return (m?m+' min ':'')+(s%60)+' sec';}
  function finish(){
    var name=S.name.trim(),steps=0,misses=0;S.lv.forEach(function(l){steps+=l.items.length;misses+=l.m;});
    var acc=steps?Math.round(steps/(steps+misses)*100):0,pm=+CFG.pass||80,pass=acc>=pm;
    var secs=Math.round((Date.now()-S.t0)/1000),at=new Date().toISOString();
    var proof='PRF-'+hash([name,acc,misses,secs,at,'TRV|'+CFG.title].join('|'))+'-'+Date.now().toString(36).toUpperCase().slice(-4);
    var o={v:1,n:name,a:CFG.title,at:at,s:secs,acc:acc,pr:proof,pass:pass?1:0,pc:pm,nl:S.L.length};
    S.L.forEach(function(r,i){var l=S.lv[i];o['L'+(i+1)]={nm:r.name,m:l.m,h:l.h,sh:l.sh,it:l.items};});
    var code='TRV1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
    var lines=['Student: '+name,'Activity: '+CFG.title,'Date: '+new Date().toLocaleDateString(),'Time: '+fmtTime(secs)];
    S.L.forEach(function(r,i){var l=S.lv[i];lines.push('Round '+(i+1)+' ('+r.name+'): '+l.items.length+' questions, '+l.m+' missed, '+l.h+' hints, '+l.sh+' shown');
      l.items.forEach(function(it){lines.push('   - '+it[0]+': '+it[1]+(it[2]?', '+it[2]+' hint'+(it[2]>1?'s':''):''));});});
    lines.push('Score: '+acc+'% ('+(pass?'passed':'needs more practice')+')','Proof code: '+proof,'','Results code (staff: paste this into the Results page):',code);
    S.R={acc:acc,pass:pass,secs:secs,proof:proof,code:code,report:lines.join('\n'),
      headline:CFG.showScore?('You finished. Score '+acc+' percent. '+(pass?'You passed.':'Needs more practice.')):'You finished.'};
    if(CFG.embedded&&!S.sent){S.sent=true;try{parent.postMessage({type:'trv-result',code:code},'*');}catch(e){}}
  }
  function copyText(t){
    function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();return ok;}
    var done=function(ok){S.msg=ok?'✓ Results copied. Paste them in an email or message.':'Could not copy. Use Save results file.';S.focusK='copy';render();tell(S.msg);};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(fb());});}else done(fb());
  }
  function vFinish(){
    var R=S.R,name=S.name.trim(),subj=(CFG.subject||'Trivia results')+' - '+name,enc=encodeURIComponent;
    var gmail='https://mail.google.com/mail/?view=cm&fs=1&to='+enc(CFG.email||'')+'&su='+enc(subj)+'&body='+enc(R.report);
    var mail='mailto:'+(CFG.email||'')+'?subject='+enc(subj)+'&body='+enc(R.report);
    return h('div',{class:'rt-card'},
      h('h2',null,F?'🏆 You finished, '+name+'!':'Activity complete',sayBtn(R.headline,'Read the score','f-say')),
      CFG.showScore?h('p',{class:'rt-score'},'Score: '+R.acc+'% — '+(R.pass?(F?'⭐ You passed!':'Passed.'):'Needs more practice.')):h('p',null,'Your work is done. Send your results to staff.'),
      h('ul',null,S.L.map(function(r,i){var l=S.lv[i];return h('li',null,(S.L.length>1?'Round '+(i+1)+': ':'')+r.name+': '+l.items.length+' questions, '+l.m+' missed'+(CFG.hints?', '+l.h+' hints':''));})),
      h('h3',null,'Send your results'),
      h('div',{class:'rt-tools'},
        h('a',{class:'rt-btn main',href:gmail,target:'_blank',rel:'noopener'},'📧 Send with Gmail'),
        h('a',{class:'rt-btn',href:mail},'✉️ Email app'),
        h('button',{class:'rt-btn',type:'button','data-k':'copy',onclick:function(){copyText(R.report);}},'📋 Copy results'),
        h('button',{class:'rt-btn',type:'button',onclick:function(){var b=new Blob([R.report],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(name||'student').replace(/[^\w-]+/g,'_')+'-trivia-results.txt';document.body.appendChild(a);a.click();a.remove();}},'💾 Save results file')),
      h('p',{class:'rt-note'},'Gmail needs internet. No internet? Use Copy or Save.'),
      S.msg?h('p',{role:'status'},S.msg):null,
      h('details',null,h('summary',null,'See the full report'),h('pre',{class:'rt-pre'},R.report)),
      h('div',{class:'rt-tools'},h('button',{class:'rt-btn',type:'button',onclick:function(){reset();render();}},'↺ Start over')));
